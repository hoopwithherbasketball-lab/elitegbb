name: ConnectGBB CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "CONNECTGBB/**"
      - "AGENTS.md"
      - ".github/workflows/connectgbb-ci.yml"
  push:
    branches:
      - main
    paths:
      - "CONNECTGBB/**"
      - "AGENTS.md"
      - ".github/workflows/connectgbb-ci.yml"

permissions:
  contents: read

concurrency:
  group: connectgbb-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CONNECTGBB

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: CONNECTGBB/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build Next.js
        run: npm run build

      - name: Package for Cloudflare
        run: npm run pages:build
